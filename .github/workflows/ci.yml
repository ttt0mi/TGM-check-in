name: Pull request checks

on:
    pull_request:
        branches:
            - main
            - staging

    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    app:
        name: App lint and type checking
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint application
              run: npm run lint

            - name: Check TypeScript
              run: npm run typecheck

    database:
        name: Supabase schema and generated types
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Start local Supabase
              run: npx supabase start

            - name: Lint database functions
              run: npx supabase db lint --local --fail-on error

            - name: Generate hosted database types
              env:
                SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
              run: |
                npx supabase gen types typescript \
                --project-id "$SUPABASE_PROJECT_ID" \
                --schema public \
                > /tmp/database.types.ts

            - name: Verify committed database types are current
              run: |
                diff -u \
                supabase/functions/_shared/database.types.ts \
                /tmp/database.types.ts
