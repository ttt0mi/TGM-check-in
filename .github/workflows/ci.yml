name: Pull request checks

on:
    pull_request:
        branches:
            - main
            - staging

    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    app:
        name: App quality gates
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint application
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Check TypeScript
              run: npm run typecheck

            - name: Check test TypeScript
              run: npm run typecheck:test

            - name: Run unit tests
              run: npm run test:unit

            - name: Build enabled frontend routes
              env:
                  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
                  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
                  TGM_FRONTEND_PUBLIC_ENABLED: "true"
                  TGM_FRONTEND_HOST_ENABLED: "true"
                  TGM_FRONTEND_AUTH_ENABLED: "true"
                  TGM_FRONTEND_OPERATOR_ENABLED: "true"
                  TGM_FRONTEND_ADMIN_ENABLED: "true"
                  TGM_FRONTEND_ANALYTICS_ENABLED: "true"
              run: npm run build

            - name: Install browser for end-to-end tests
              run: npx playwright install --with-deps chromium

            - name: Run browser tests
              run: npm run test:e2e

    database:
        name: Supabase schema and generated types
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Start local Supabase
              run: npx supabase start

            - name: Lint database functions
              run: npx supabase db lint --local --fail-on error

            - name: Check Edge Functions
              working-directory: supabase/functions
              run: deno check get-public-directory/index.ts submit-public-visit/index.ts get-visitor-visit/index.ts respond-to-host-visit/index.ts get-host-decision-preview/index.ts register-organization/index.ts organization-signup-availability/index.ts create-branch/index.ts invite-operator/index.ts accept-operator-invite/index.ts get-operator-invitation-preview/index.ts manage-operator/index.ts operator-directory/index.ts manage-operator-invitation/index.ts create-assisted-visit/index.ts reception-visit-action/index.ts send-host-email/index.ts get-visit-analytics/index.ts export-visit-report/index.ts

            - name: Run Edge Function tests
              working-directory: supabase/functions
              run: deno test _shared/tgm_test.ts _shared/reporting_test.ts _shared/email-transport_test.ts create-branch/validation_test.ts

            - name: Run database regressions
              run: |
                  for test_file in \
                    supabase/tests/public_checkin_retries.sql \
                    supabase/tests/tenant_isolation.sql \
                    supabase/tests/visit_lifecycle_accountability.sql \
                    supabase/tests/operator_invitation_delivery.sql \
                    supabase/tests/public_privacy_notice.sql \
                    supabase/tests/host_decision_preview.sql; do
                    docker exec -i supabase_db_TGM-check-in \
                      psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$test_file" || exit 1
                  done

            - name: Generate hosted database types
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
              run: |
                  npx supabase gen types typescript \
                  --project-id "$SUPABASE_PROJECT_ID" \
                  --schema public \
                  > /tmp/database.types.ts

            - name: Verify committed database types are current
              run: |
                  diff -u \
                  supabase/functions/_shared/database.types.ts \
                  /tmp/database.types.ts
